name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, pipeline, dashboard]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../../requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        continue-on-error: true
        run: ruff format --check .

      - name: Pytest
        run: |
          if [ -d tests ]; then pytest; else echo "no tests for ${{ matrix.service }}"; fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (vulnérabilités dépendances)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r services/api/requirements.txt || true
          pip-audit -r services/pipeline/requirements.txt || true
          pip-audit -r services/dashboard/requirements.txt || true
